<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Student Registration - NRIIT LMS</title>
</head>

<body>
    <header>
        <h1>Student Registration</h1>
        <p>Learn &bull; Practice &bull; Get Placed</p>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('courses') }}">Courses</a>
            <a href="{{ url_for('trainers') }}">Trainers</a>
            <a href="{{ url_for('register') }}" class="active">Register</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('contact') }}">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Student Registration Form</h2>
            <form id="registerForm" method="POST">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter Your Full Name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter Your Email Address" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a Strong Password" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">

                <label>Gender</label>
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: inline; margin-right: 1.5rem; font-weight: normal;">
                        <input type="radio" name="gender" value="Male" checked> Male
                    </label>
                    <label style="display: inline; font-weight: normal;">
                        <input type="radio" name="gender" value="Female"> Female
                    </label>
                </div>

                <label for="course">Select Course</label>
                <select id="course">
                    <option value="Python FullStack">Python FullStack Development</option>
                    <option value="Java FullStack">Java FullStack Development</option>
                </select>

                <button type="submit" class="btn">Register</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NRIIT Learning Management System. All Rights Reserved.</p>
        <p>Email: info@nriit.edu | Phone: +91 9876543210</p>
        <p>Follow Us:
            <a href="#">Facebook</a> |
            <a href="#">Instagram</a> |
            <a href="#">LinkedIn</a>
        </p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script> 
</body>

</html>
